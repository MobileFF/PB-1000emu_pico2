; PB-1000 Emulator Configuration
;
; 読み込み優先順位（低→高）:
;   /pb1000.ini       ← このファイル (Pico フラッシュのルートに配置)
;   /sd/pb1000.ini
;   <profile>/pb1000.ini
;
; 記述したキーのみ上書きされます。省略した項目はデフォルト値を使用します。
; コメントは ; または # で始めます。

; -----------------------------------------------------------------------------
[display]
; -----------------------------------------------------------------------------

; ディスプレイドライバを選択する
;   ILI9341 : 320x240 (デフォルト)
;   ST7796  : 480x320 (MSP4021等)
;driver = ILI9341
driver = ST7796
;spi_baudrate = 26000000

; エミュレータ画面の拡大倍率
;   ILI9341 用: 1.5 (推奨)
;   ST7796  用: 2.0 (推奨)
;scale = 1.5
scale = 2.0

; LCD縦解像度: 32 = PB-1000オリジナル (デフォルト), 64 = 拡張モード
; 64ドットモードでは、rowアドレスのBit<2>が有効になり、pages 4-7 (行32-63) に書き込み可能
;lcd_height = 32
lcd_height = 64

; 画面上の表示位置オフセット
;   x_offset: LCD左端のX座標。省略時はLCDが水平センタリングされます。
;   y_offset: LCD上端のY座標。省略時はLCD＋シートキーバー全体が垂直センタリングされます。
;             値を小さくするほど上寄りに表示されます。
; x_offset = 48
; y_offset = 95

; 画面の回転設定（基板の実装向きに合わせる）
;   0   : 通常向き（デフォルト）
;   180 : 上下反転（180度回転）。タッチパネルの座標もあわせて反転されます。
rotation = 180


; -----------------------------------------------------------------------------
[keyboard]
; -----------------------------------------------------------------------------

; USBキーボードを有効にする
enable_usb_kbd = true

; UARTキーボードを有効にする
; enable_uart_kbd = true
; uart_baudrate   = 9600
; uart_tx_pin     = 4
; uart_rx_pin     = 5


; KEY_INT パルス間隔 (ms)。デフォルト25ms、実機のKey/Pulse ISRは3.9ms(256Hz)周期。
; ROM側のキー確定判定(デバウンス)は複数回連続でこの間隔ごとにスキャンされて初めて成立するため、
; 値を小さくするほど「押してから確定するまでの体感時間」が短くなる(=キーが認識されやすくなる)。
; ただしカーソルキーリピート等、他の時間ベースの調整(doc/dev_guide.md §13)もこの間隔を前提に
; 実測チューニングされているため、変更後は通常のタイピング・カーソルリピート動作も確認すること。
; REPLからも変更可: hd61700.set_key_pulse_interval_ms(ms)
; key_pulse_interval_ms = 10

; キー押下継続時間 (ms)
; key_hold_ms = 120

; キーリリース強制タイムアウト (ms)
; key_release_hard_timeout_ms = 1200

; キー間のギャップ (ms)
; inter_key_gap_ms = 80


; -----------------------------------------------------------------------------
[emulator]
; -----------------------------------------------------------------------------

; シリアルコンソール (UART REPL) を無効にする
; boot.py が GP0/GP1 に接続した UART0 REPL を停止する (USB CDC REPL には影響しない)
enable_repl_uart = true

; フレーム更新間隔 (ms) — 33ms ≒ 30fps
; frame_interval_ms = 33

; 1スライスあたりのCPUステップ数
active_step_count = 14000

; スリープ中のポーリング間隔 (ms)
; sleep_poll_ms = 10

; タイマーティック換算ステップ数
; step_timer_tick_steps = 8000

; メインループのアイドル待機 (ms)
; loop_idle_ms = 1


; -----------------------------------------------------------------------------
[disk]
; -----------------------------------------------------------------------------

; 仮想FDDを有効にする
enabled = true

; ストレージバックエンド: raw
backend = raw

; ディスクイメージファイルのパス
path = /sd/disks/disk1.img

; 読み取り専用
readonly = false


; -----------------------------------------------------------------------------
[profile]
; -----------------------------------------------------------------------------

; 起動時のデフォルトプロファイル名
; default_profile = default

; プロファイル選択UIのタイムアウト (ms)
ui_timeout_ms = 30000
;ui_timeout_ms = 3000


; -----------------------------------------------------------------------------
[joystick]
; -----------------------------------------------------------------------------

; Atari 9ピンジョイスティックを有効にする
; enable = true

; FIRE2ボタンを有効にする
; enable_fire2 = true

; デバウンス時間 (ms)
; debounce_ms = 20

; ポーリング間隔 (ms)
; poll_interval_ms = 10

; キーマッピング
;   指定方法:
;     名前    : exe, ans, shift, up, down, left, right, bs, ins, brk,
;               newall, menu, cal, cls, kana, a-z, 0-9
;     座標直接: row,col  例) 10,4
;   省略するとデフォルト値を使用します。
;
; key_up    = up; デフォルト: カーソル上
; key_down  = down; デフォルト: カーソル下
; key_left  = left; デフォルト: カーソル左
; key_right = right; デフォルト: カーソル右
; key_fire1 = exe; デフォルト: EXE
; key_fire2 = shift; デフォルト: SHIFT

[beep]
enable   = true
gpio_pin = 14
freq_hz  = 4000
;freq_hz  = 4470
duty     = 5 
;duty     = 30


; -----------------------------------------------------------------------------
[touch]
; -----------------------------------------------------------------------------

; ILI9341/ST7796 のどちらの設定も同じ [touch] セクションに共存できます。
; "ili9341." / "st7796." を key の先頭に付けると、そのドライバが
; [display] driver で選択されているときだけ適用されます。
; プレフィックス無しの key はどちらのドライバでも(上書きされなければ)適用されます。
; 各項目の省略時デフォルトはドライバ別の内蔵値(下記コメント参照)。
; ※ swap_xy/x_inv/y_inv はSDカードマウント前に読み込まれるため、内蔵フラッシュの
;   /pb1000.ini のみ有効 (/sd/pb1000.ini やプロファイル別 ini は反映されません)。
;   x_offset 系はSDカード上・プロファイル別 ini でも上書き可能です。

; >>>>> ILI9341 <<<<<
; XPT2046のX/Y軸入れ替え・反転。パネルによりタッチ座標が逆に読める場合に指定。
; 内蔵デフォルト: swap_xy=true, x_inv=false, y_inv=false
;ili9341.swap_xy = true
;ili9341.y_inv = true
;ili9341.x_inv = true

; タッチパネルの座標補正オフセット (ピクセル単位、正負両方可)
; 内蔵デフォルト: x_offset=0  y_offset=-10 funckey_x_offset=0  funckey_y_offset=24
; ↑これらは y_inv=false 前提でチューニングされた値。y_inv/x_inv を有効にすると
; 座標の意味が反転するため、下記のオフセットも再調整が必要
; （符号反転を起点に実機で微調整すること）。
;
; LCDエリア (TK1..TK16) 用
;ili9341.x_offset = 8
;ili9341.y_offset = -10

; シートキーバー (FBAR) 用
;ili9341.funckey_x_offset = 8
;ili9341.funckey_y_offset = -10


; >>>>> ST7796 (MSP4021等) <<<<<
; 内蔵デフォルト: swap_xy=true, x_inv=true, y_inv=true
;st7796.swap_xy = true
;st7796.x_inv = true
;st7796.y_inv = true

; 内蔵デフォルト: x_offset=8  y_offset=0  funckey_x_offset=2  funckey_y_offset=-8
;st7796.x_offset = 8
;st7796.y_offset = 0
;st7796.funckey_x_offset = 2
;st7796.funckey_y_offset = -8

; -----------------------------------------------------------------------------
[pio_uart]
; -----------------------------------------------------------------------------

; PIO UART (RS-232C) のボーレート (GP6=TX / GP13=RX)
baudrate = 9600


; -----------------------------------------------------------------------------
[wifi]
; -----------------------------------------------------------------------------
; WiFiのSSID。NTP同期を行う場合に設定してください。空欄の場合は同期をスキップします。
ssid = XXXXX
; WiFiのパスワード。
password = XXXXX


; -----------------------------------------------------------------------------
[debug]
; -----------------------------------------------------------------------------

; C コア側のデバッグトレースを起動時に有効化する（mpremote での REPL 操作は不要）。
; いずれかを true にすると [HD61700] ... のトレース行がシリアルコンソールに出力される。
; 詳細: doc/dev_guide.md セクション11「デバッグとトレース」

; CPU命令トレース（特定PCブレークポイントでのみ出力、常時ではない）
;cpu_debug = true

; キー入力トレース（KEYSCAN GRE等）。ROMのキースキャンループを常時追うため出力が非常に多い。
; 特定のUSBキーだけを追いたい場合は下の newall_debug を使うこと。
;key_debug = true

; LCD書き込みトレース
;lcd_debug = true

; -----------------------------------------------------------------------------
[ntp]
; -----------------------------------------------------------------------------
; エミュレータ起動時のNTP同期を有効にする (WiFi接続が必要です)
enable = true
;enable = false

; NTPサーバのアドレス
server = pool.ntp.org

; タイムゾーンの時差 (JSTの場合は 9)
tz_offset_h = 9

; 接続タイムアウト時間 (ミリ秒)
timeout_ms = 15000
